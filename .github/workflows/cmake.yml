name: CMake

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Keep building the other platform when one fails, so a platform-specific
      # break does not hide the state of the other
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev xvfb x11-utils

    - name: Configure CMake
      run: cmake --preset ${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build --preset ${{env.BUILD_TYPE}}

    - name: Check X11
      if: runner.os == 'Linux'
      run: |
        xvfb-run -a sh -c '
          echo "DISPLAY=$DISPLAY"
          xdpyinfo
        '

    - name: Test
      working-directory: ${{github.workspace}}/build/${{env.BUILD_TYPE}}
      if: runner.os == 'Linux'
      run: xvfb-run -a ctest -C ${{env.BUILD_TYPE}} --output-on-failure --no-tests=error

    - name: Test
      working-directory: ${{github.workspace}}/build/${{env.BUILD_TYPE}}
      if: runner.os == 'Windows'
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure --no-tests=error
